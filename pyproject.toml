[project]
name = "aml-poland-mcp"
version = "0.1.0"
description = "MCP server automating AML/KYB due diligence for Polish accounting firms (biura rachunkowe): KRS/CEIDG lookup, Biała Lista VAT status, CRBR UBO lookup, sanctions/PEP screening, and AML risk card generation (PDF/Markdown)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ustin Integrations" }]
keywords = ["mcp", "aml", "kyc", "kyb", "poland", "compliance", "krs", "crbr", "sanctions"]

dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jinja2>=3.1.0",
    "markdown>=3.6",
    "xhtml2pdf>=0.2.16",
    "tenacity>=8.2.0",
    "beautifulsoup4>=4.12.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pypdf>=4.0.0",
]

[project.scripts]
aml-poland-mcp = "aml_poland_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aml_poland_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
